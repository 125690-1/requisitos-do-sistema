<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup do Sistema - Controle Ouvidoria</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8 flex flex-col justify-between">

  <main class="max-w-3xl mx-auto w-full space-y-6 my-auto">
    
    <!-- Cabeçalho Limpo e Direto -->
    <header class="bg-slate-900 text-white p-6 rounded-2xl shadow-md text-center">
      <h1 class="text-xl md:text-2xl font-bold text-amber-400">Configuração Inicial do Sistema</h1>
      <p class="text-xs md:text-sm text-slate-300 mt-1">
        Preencha os questionários abaixo para definirmos a estrutura da sua plataforma.
      </p>
    </header>

    <!-- Lista de Questionamentos -->
    <div class="space-y-4">
      
      <!-- Card 1: Mapeamento -->
      <a href="mapeamento-colunas.html" class="group bg-white p-5 rounded-xl shadow-sm hover:shadow-md border border-slate-200 hover:border-amber-400 transition-all flex items-center justify-between">
        <div class="space-y-1">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold uppercase tracking-wider px-2 py-0.5 bg-amber-50 text-amber-700 rounded">Etapa 1</span>
            <span id="badge-status-1" class="text-xs font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">Pendente</span>
          </div>
          <h2 class="text-base font-bold text-slate-900 group-hover:text-amber-600 transition-colors">Mapeamento de Colunas (De-Para)</h2>
        </div>
        <span class="text-xs font-bold text-amber-600 group-hover:underline flex items-center gap-1">Responder &rarr;</span>
      </a>

      <!-- Card 2: Em Breve -->
      <div class="bg-white/50 p-5 rounded-xl border border-slate-200 flex items-center justify-between opacity-60">
        <div class="space-y-1">
          <span class="text-xs font-bold uppercase tracking-wider px-2 py-0.5 bg-slate-100 text-slate-500 rounded">Etapa 2</span>
          <h2 class="text-base font-bold text-slate-600">Regras de Permissão e Perfis</h2>
        </div>
        <span class="text-xs font-bold text-slate-400">Aguardando</span>
      </div>

    </div>

  </main>

  <footer class="text-center text-xs text-slate-400 mt-6">
    Controle Ouvidoria
  </footer>

  <script>
    const colunas = [
      "TIPO", "NUMERO PONTO FORNECIMENTO", "NUMERO DO CASO", "DATA DE ABERTURA",
      "CONTA CONTRATO", "NOME DA CONTA", "ENDERECO", "MUNICIPALIDADE",
      "REGIONAL", "OBSERVACOES", "TEMA AGRUPADO", "PROCESSO", "AREA",
      "RETORNO", "STATUS PROCESSO", "RESPOSTA AREA"
    ];

    let preenchido = false;
    colunas.forEach(col => {
      const k = col.replace(/\s+/g, '_');
      if (localStorage.getItem("m1_" + k) || localStorage.getItem("m2_" + k)) {
        preenchido = true;
      }
    });

    if (preenchido) {
      const badge = document.getElementById("badge-status-1");
      badge.className = "text-xs font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800";
      badge.innerText = "Respondido ✓";
    }
  </script>

</body>
</html>
